[/Script/Engine.RendererSettings]
; Lumen GI + reflections, virtual shadow maps, no baked lighting: every light of the room is a real-time light
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4
r.SkinCache.CompileShaders=True
; hardware ray tracing: Lumen traces the real triangles - the two bodies too, which software Lumen (distance fields and the
; surface cache) cannot see: they shade the bounce light round them and show in reflections - and the path tracer for stills.
; Shadows stay virtual shadow maps.
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
r.PathTracing=True
; the room's shell is one-sided planes facing inwards: with back faces culled, the shadow rays of Lumen's surface cache let the sun
; through the roof and the walls - the whole room bounced sunlight (3 x the indirect light of the path-traced reference)
r.LumenScene.DirectLighting.HardwareRayTracing.ForceTwoSided=1
r.SupportSkyAtmosphere=True
; one room, 16 GB of video memory: every texture whole, no streaming pop-in in captures
r.TextureStreaming=False

